<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architettura di Octopus</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .band { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
      .band-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #6b7280; }
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-text { font-size: 12.5px; }
      .edge { fill: none; stroke: #374151; stroke-width: 1.8; }
      .edge-dashed { fill: none; stroke: #374151; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .edge-red { fill: none; stroke: #b91c1c; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .edge-label { font-size: 11.5px; fill: #374151; }
      .edge-label-red { font-size: 11.5px; fill: #b91c1c; font-weight: 600; }
      .opus { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2; }
      .sonnet { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .haiku { fill: #d1fae5; stroke: #047857; stroke-width: 2; }
      .neutral { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
      .note { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .escalation { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
      .t-opus { fill: #5b21b6; }
      .t-sonnet { fill: #1e40af; }
      .t-haiku { fill: #065f46; }
      .t-neutral { fill: #111827; }
      .t-body { fill: #374151; }
      .t-red { fill: #991b1b; }
    </style>
  </defs>

  <rect width="1280" height="920" fill="#ffffff"/>

  <text class="title" x="40" y="38">Octopus</text>
  <text class="subtitle" x="138" y="38">orchestrazione multi-modello con routing a cascata</text>

  <rect class="band" x="20" y="64" width="1240" height="164" rx="10"/>
  <text class="band-label" x="44" y="84">PIANIFICAZIONE · FASI 0–2</text>
  <rect class="band" x="20" y="240" width="1240" height="196" rx="10"/>
  <text class="band-label" x="44" y="260">ESECUZIONE · FASE 3</text>
  <rect class="band" x="20" y="448" width="1240" height="244" rx="10"/>
  <text class="band-label" x="44" y="466">REVISIONE A CASCATA · FASE 4</text>
  <rect class="band" x="20" y="704" width="1240" height="160" rx="10"/>
  <text class="band-label" x="44" y="722">INTEGRAZIONE · FASE 5</text>

  <rect class="neutral" x="60" y="120" width="150" height="70" rx="10"/>
  <text class="box-title t-neutral" x="135" y="150" text-anchor="middle">Task utente</text>
  <text class="box-text t-body" x="135" y="170" text-anchor="middle">/octopus &lt;task&gt;</text>

  <rect class="opus" x="270" y="100" width="560" height="110" rx="12"/>
  <text class="box-title t-opus" x="550" y="130" text-anchor="middle">Opus 5.5 · Testa</text>
  <text class="box-text t-body" x="550" y="154" text-anchor="middle">Inquadramento → Ricognizione → Piano</text>
  <text class="box-text t-body" x="550" y="174" text-anchor="middle">per ogni sub-task: tier · rischio · gate eseguibile · revisione</text>
  <text class="box-text t-body" x="550" y="194" text-anchor="middle">budget di spawn · file di stato per task lunghi</text>

  <rect class="haiku" x="900" y="120" width="250" height="70" rx="10"/>
  <text class="box-title t-haiku" x="1025" y="150" text-anchor="middle">Explore · Haiku 5.5</text>
  <text class="box-text t-body" x="1025" y="170" text-anchor="middle">ricognizione e ricerche, sintesi compatte</text>

  <path class="edge" d="M210,155 H268" marker-end="url(#arrow)"/>
  <path class="edge-dashed" d="M830,155 H898" marker-end="url(#arrow)"/>
  <text class="edge-label" x="864" y="147" text-anchor="middle">delega</text>

  <path class="edge" d="M550,210 V263" marker-end="url(#arrow)"/>

  <rect class="neutral" x="420" y="265" width="260" height="56" rx="10"/>
  <text class="box-title t-neutral" x="550" y="289" text-anchor="middle">Router</text>
  <text class="box-text t-body" x="550" y="308" text-anchor="middle">difficoltà × rischio → tier di partenza</text>

  <rect class="note" x="760" y="265" width="390" height="56" rx="10"/>
  <text class="box-text t-body" x="955" y="288" text-anchor="middle">ToT solo ai punti di decisione incerti</text>
  <text class="box-text t-body" x="955" y="307" text-anchor="middle">best-of-N: 2–3 Haiku in worktree, vince chi passa il gate</text>

  <path class="edge" d="M550,321 V333"/>
  <path class="edge" d="M245,333 H985"/>
  <path class="edge" d="M245,333 V343" marker-end="url(#arrow)"/>
  <path class="edge" d="M615,333 V343" marker-end="url(#arrow)"/>
  <path class="edge" d="M985,333 V343" marker-end="url(#arrow)"/>

  <rect class="haiku" x="80" y="345" width="330" height="75" rx="10"/>
  <text class="box-title t-haiku" x="245" y="372" text-anchor="middle">executor · Haiku 5.5</text>
  <text class="box-text t-body" x="245" y="393" text-anchor="middle">default: meccanico, ≤3 file, gate eseguibile</text>

  <rect class="sonnet" x="450" y="345" width="330" height="75" rx="10"/>
  <text class="box-title t-sonnet" x="615" y="372" text-anchor="middle">executor · Sonnet 5.5</text>
  <text class="box-text t-body" x="615" y="393" text-anchor="middle">multi-file, debug, rischio alto, Haiku fallito</text>

  <rect class="opus" x="820" y="345" width="330" height="75" rx="10"/>
  <text class="box-title t-opus" x="985" y="372" text-anchor="middle">Opus 5.5 · Testa</text>
  <text class="box-text t-body" x="985" y="393" text-anchor="middle">decisioni architetturali, conflitti, fix piccoli</text>

  <path class="edge" d="M245,420 V502" marker-end="url(#arrow)"/>
  <path class="edge" d="M615,420 V476 H245"/>
  <path class="edge" d="M985,420 V476 H615"/>

  <rect class="neutral" x="80" y="502" width="260" height="80" rx="10"/>
  <text class="box-title t-neutral" x="210" y="534" text-anchor="middle">Gate deterministico</text>
  <text class="box-text t-body" x="210" y="556" text-anchor="middle">test · typecheck · lint · build</text>

  <path class="edge" d="M340,542 H378" marker-end="url(#arrow)"/>

  <rect class="neutral" x="380" y="502" width="180" height="90" rx="10"/>
  <text class="box-title t-neutral" x="470" y="540" text-anchor="middle">Rischio?</text>
  <text class="box-text t-body" x="470" y="562" text-anchor="middle">gate verde</text>

  <path class="edge" d="M560,522 H998" marker-end="url(#arrow)"/>
  <text class="edge-label" x="780" y="514" text-anchor="middle">basso · niente reviewer (revisione a campione per ondata)</text>

  <path class="edge" d="M560,582 H638" marker-end="url(#arrow)"/>
  <text class="edge-label" x="599" y="574" text-anchor="middle">medio / alto</text>

  <rect class="sonnet" x="640" y="547" width="260" height="70" rx="10"/>
  <text class="box-title t-sonnet" x="770" y="576" text-anchor="middle">octopus-reviewer · Sonnet 5.5</text>
  <text class="box-text t-body" x="770" y="598" text-anchor="middle">contesto fresco, diff contro baseline</text>

  <path class="edge" d="M900,582 H998" marker-end="url(#arrow)"/>
  <text class="edge-label" x="949" y="574" text-anchor="middle">approve</text>

  <rect class="neutral" x="1000" y="502" width="150" height="90" rx="10"/>
  <text class="box-title t-neutral" x="1075" y="542" text-anchor="middle">Sub-task</text>
  <text class="box-title t-neutral" x="1075" y="562" text-anchor="middle">chiuso</text>

  <rect class="escalation" x="80" y="646" width="880" height="36" rx="10"/>
  <text class="box-text t-red" x="520" y="669" text-anchor="middle">Escalation: Haiku → Sonnet → Opus · max 2 tentativi per tier · il rilancio riceve l'errore reale</text>

  <path class="edge-red" d="M210,582 V644" marker-end="url(#arrow-red)"/>
  <text class="edge-label-red" x="220" y="620">gate rosso</text>
  <path class="edge-red" d="M770,617 V644" marker-end="url(#arrow-red)"/>
  <text class="edge-label-red" x="780" y="635">revise</text>
  <path class="edge-red" d="M80,664 H28 V382 H78" marker-end="url(#arrow-red)"/>

  <path class="edge" d="M1075,592 V740" marker-end="url(#arrow)"/>

  <rect class="sonnet" x="800" y="742" width="350" height="80" rx="10"/>
  <text class="box-title t-sonnet" x="975" y="773" text-anchor="middle">octopus-devops · Sonnet 5.5</text>
  <text class="box-text t-body" x="975" y="795" text-anchor="middle">integrazione worktree · verifica end-to-end</text>

  <path class="edge" d="M800,782 H762" marker-end="url(#arrow)"/>

  <rect class="opus" x="420" y="742" width="340" height="80" rx="10"/>
  <text class="box-title t-opus" x="590" y="773" text-anchor="middle">Opus 5.5 · Riconciliazione</text>
  <text class="box-text t-body" x="590" y="795" text-anchor="middle">rilegge la richiesta originale e verifica</text>
  <text class="box-text t-body" x="590" y="811" text-anchor="middle">il comportamento osservabile</text>

  <path class="edge" d="M420,782 H382" marker-end="url(#arrow)"/>

  <rect class="neutral" x="80" y="742" width="300" height="80" rx="10"/>
  <text class="box-title t-neutral" x="230" y="773" text-anchor="middle">Riepilogo all'utente</text>
  <text class="box-text t-body" x="230" y="795" text-anchor="middle">piano · routing · verdetti · spawn vs budget</text>

  <rect class="opus" x="80" y="884" width="22" height="16" rx="4"/>
  <text class="box-text t-body" x="110" y="897">Opus 5.5 · giudizio</text>
  <rect class="sonnet" x="270" y="884" width="22" height="16" rx="4"/>
  <text class="box-text t-body" x="300" y="897">Sonnet 5.5 · dev ops</text>
  <rect class="haiku" x="470" y="884" width="22" height="16" rx="4"/>
  <text class="box-text t-body" x="500" y="897">Haiku 5.5 · esecuzione</text>
  <rect class="neutral" x="680" y="884" width="22" height="16" rx="4"/>
  <text class="box-text t-body" x="710" y="897">verifica deterministica / stato</text>
  <path class="edge-red" d="M920,892 H960"/>
  <text class="box-text t-body" x="970" y="897">fallimento ed escalation</text>
</svg>
